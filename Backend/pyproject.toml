[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "solarcast-api"
version = "0.3.0"
description = "Local solar data validation and chronological model comparison"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.20,<1", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "xgboost>=3,<4", "lightgbm>=4.6,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
